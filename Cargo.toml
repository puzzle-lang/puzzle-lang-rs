[workspace]
members = [
    "puzzle-cli",
    "puzzle-core",
    "puzzle-driver"
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
puzzle-driver = { path = "./puzzle-driver" }
puzzle-core = { path = "./puzzle-core" }
indoc = { version = "2.0.7" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
toml = { version = "1.0.3+spec-1.1.0" }
regex = { version = "1.12.3" }
postcard = { version = "1.1.3", features = ["alloc"] }